[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-energy-mcp"
version = "0.2.0"
description = "MCP Server für Schweizer Energiedaten – BFE Elektrizitätsproduktionsanlagen, Windkraft, Wasserkraft, Photovoltaik, Solareignung, Energiestädte via GeoAdmin REST API und opendata.swiss"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Schulamt Stadt Zürich"},
]
keywords = [
    "mcp", "model-context-protocol", "energy", "energie", "switzerland",
    "open-data", "bfe", "geoadmin", "swisstopo", "solar", "wind",
    "wasserkraft", "photovoltaik", "energiestadt", "opendata-swiss",
    "kraftwerk", "stromproduktion", "erneuerbare-energien",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp[cli]>=1.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
swiss-energy-mcp = "swiss_energy_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_energy_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: Tests that make real API calls (skipped by default)",
]
