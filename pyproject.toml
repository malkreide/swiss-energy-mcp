[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-energy-mcp"
version = "0.4.1"
description = "MCP Server für Schweizer Energiedaten – BFE Elektrizitätsproduktionsanlagen, Windkraft, Wasserkraft, Photovoltaik, Solareignung, Energiestädte via GeoAdmin REST API und opendata.swiss"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Hayal Oezkan", email = "hayal.oezkan@gmail.com"},
]
keywords = [
    "mcp", "model-context-protocol", "energy", "energie", "switzerland",
    "open-data", "bfe", "geoadmin", "swisstopo", "solar", "wind",
    "wasserkraft", "photovoltaik", "energiestadt", "opendata-swiss",
    "kraftwerk", "stromproduktion", "erneuerbare-energien",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # Upper bound added deliberately: `mcp` 2.0.0 removed `mcp.server.fastmcp`
    # outright (the API moved to `mcp.server.mcpserver`), so an unbounded
    # `>=1.28.1` breaks every fresh install — CI and `pip install` alike.
    # Migrating to the 2.x API is real work and a decision to take on purpose,
    # not one a resolver should make silently.
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0,<27",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    # Exakter Pin, und die einzige Stelle, an der die ruff-Version steht. Als
    # hier eine Spanne stand, loeste der dev-Install auf die jeweils neueste
    # Version auf, waehrend ci.yml `ruff==0.16.1` darueber installierte — an
    # zwei Stellen, in den Jobs `test` und `lint`.
    # `test_werkzeug_versionen.py` faellt, wenn hier wieder eine Spanne steht
    # oder ein Workflow eine zweite Version setzt.
    "ruff==0.16.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
swiss-energy-mcp = "swiss_energy_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_energy_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: Tests that make real API calls (skipped by default)",
]
