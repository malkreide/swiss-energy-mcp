name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev]" --system

      # Kein eigener ruff-Install: der Pin kommt mit dem dev-Install oben mit.
      # Hier stand `pip install ruff==<version>`, das danach lief und gegen
      # pyproject gewann — ein Bump dort haette in der CI nichts bewirkt.
      - name: Linting mit ruff
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax-Prüfung
        run: python -m compileall -q src/

      - name: Import-Test
        run: python -c "from swiss_energy_mcp.server import mcp; print('Import OK')"

      - name: Unit-Tests (ohne Live-API)
        run: pytest tests/ -m "not live"

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Holt ruff aus dem [dev]-Extra, wo seine Version als einziges steht.
      # Dieser Job installiert das Projekt sonst nicht — den frueheren
      # `pip install ruff==<version>` ersatzlos zu streichen naehme ihm das
      # Werkzeug. Er braucht den Install, nur ohne zweite Versionsangabe.
      - run: pip install -e ".[dev]"

      - run: ruff check src/ tests/ scripts/

      - run: ruff format --check src/ tests/ scripts/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
