name: Live API Tests

# Live tests hit the real GeoAdmin and opendata.swiss APIs. They run on a
# nightly schedule and on demand, separate from the PR CI (OPS-001).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run live integration tests
        run: pytest tests/ -m live -v --tb=short
