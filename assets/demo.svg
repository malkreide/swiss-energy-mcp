<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#16172b"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect width="800" height="38" rx="12" fill="#252640"/>
  <rect y="28" width="800" height="10" fill="#252640"/>
  <!-- Window dots -->
  <circle cx="20" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="19" r="6" fill="#febc2e"/>
  <circle cx="60" cy="19" r="6" fill="#28c840"/>
  <text x="110" y="23" fill="#8b8fa3" font-size="13" font-weight="600">Claude Code</text>
  <!-- MCP badge -->
  <rect x="660" y="8" width="126" height="22" rx="6" fill="#2d4a2d"/>
  <text x="672" y="23" fill="#6fcf6f" font-size="11" font-weight="600">swiss-energy-mcp</text>

  <!-- User message bubble -->
  <rect x="280" y="52" width="500" height="38" rx="10" fill="#2a3d2a" filter="url(#shadow)"/>
  <text x="295" y="76" fill="#c8e6c8" font-size="12.5">Which power plants are near the school in Waedenswil?</text>

  <!-- Tool call block -->
  <rect x="20" y="104" width="760" height="72" rx="8" fill="#1e1f35"/>
  <rect x="20" y="104" width="760" height="72" rx="8" fill="none" stroke="#3b3d5e" stroke-width="1"/>
  <circle cx="38" cy="120" r="5" fill="#a78bfa"/>
  <text x="50" y="124" fill="#a78bfa" font-size="11" font-weight="700">TOOL CALL: ENERGY_FIND_POWER_PLANTS</text>
  <text x="38" y="144" fill="#8b8fa3" font-size="11">latitude: 47.2254</text>
  <text x="38" y="160" fill="#8b8fa3" font-size="11">longitude: 8.6697</text>
  <text x="250" y="144" fill="#8b8fa3" font-size="11">radius_m: 10000</text>
  <text x="250" y="160" fill="#8b8fa3" font-size="11">response_format: "markdown"</text>

  <!-- Result section -->
  <text x="30" y="205" fill="#e2e4f0" font-size="14" font-weight="700">Power Plants near Waedenswil</text>
  <text x="30" y="222" fill="#8b8fa3" font-size="11">(GeoAdmin REST API - ch.bfe.elektrizitaetsproduktionsanlagen)</text>

  <!-- Table header -->
  <rect x="30" y="234" width="740" height="26" rx="4" fill="#252640"/>
  <text x="42" y="252" fill="#a78bfa" font-size="11" font-weight="600">Name</text>
  <text x="280" y="252" fill="#a78bfa" font-size="11" font-weight="600">Type</text>
  <text x="440" y="252" fill="#a78bfa" font-size="11" font-weight="600">Capacity</text>
  <text x="580" y="252" fill="#a78bfa" font-size="11" font-weight="600">Status</text>
  <text x="690" y="252" fill="#a78bfa" font-size="11" font-weight="600">Distance</text>

  <!-- Table rows -->
  <line x1="30" y1="264" x2="770" y2="264" stroke="#2a2b45" stroke-width="1"/>
  <text x="42" y="282" fill="#e2e4f0" font-size="11">KW Sihlbrugg</text>
  <text x="280" y="282" fill="#6fcf6f" font-size="11">Hydropower</text>
  <text x="440" y="282" fill="#e2e4f0" font-size="11">2.4 MW</text>
  <text x="580" y="282" fill="#6fcf6f" font-size="11">Active</text>
  <text x="690" y="282" fill="#8b8fa3" font-size="11">3.2 km</text>

  <line x1="30" y1="294" x2="770" y2="294" stroke="#2a2b45" stroke-width="1"/>
  <text x="42" y="312" fill="#e2e4f0" font-size="11">PV Turnhalle Waedenswil</text>
  <text x="280" y="312" fill="#febc2e" font-size="11">Photovoltaic</text>
  <text x="440" y="312" fill="#e2e4f0" font-size="11">0.12 MW</text>
  <text x="580" y="312" fill="#6fcf6f" font-size="11">Active</text>
  <text x="690" y="312" fill="#8b8fa3" font-size="11">0.8 km</text>

  <line x1="30" y1="324" x2="770" y2="324" stroke="#2a2b45" stroke-width="1"/>
  <text x="42" y="342" fill="#e2e4f0" font-size="11">EW Horgen AG</text>
  <text x="280" y="342" fill="#6fcf6f" font-size="11">Hydropower</text>
  <text x="440" y="342" fill="#e2e4f0" font-size="11">1.8 MW</text>
  <text x="580" y="342" fill="#6fcf6f" font-size="11">Active</text>
  <text x="690" y="342" fill="#8b8fa3" font-size="11">5.1 km</text>

  <line x1="30" y1="354" x2="770" y2="354" stroke="#2a2b45" stroke-width="1"/>
  <text x="42" y="372" fill="#e2e4f0" font-size="11">Biogas Aeugst</text>
  <text x="280" y="372" fill="#8bc7f0" font-size="11">Biomass</text>
  <text x="440" y="372" fill="#e2e4f0" font-size="11">0.35 MW</text>
  <text x="580" y="372" fill="#6fcf6f" font-size="11">Active</text>
  <text x="690" y="372" fill="#8b8fa3" font-size="11">7.6 km</text>

  <line x1="30" y1="384" x2="770" y2="384" stroke="#2a2b45" stroke-width="1"/>
  <text x="42" y="402" fill="#e2e4f0" font-size="11">PV Sekundarschule Au</text>
  <text x="280" y="402" fill="#febc2e" font-size="11">Photovoltaic</text>
  <text x="440" y="402" fill="#e2e4f0" font-size="11">0.09 MW</text>
  <text x="580" y="402" fill="#6fcf6f" font-size="11">Active</text>
  <text x="690" y="402" fill="#8b8fa3" font-size="11">4.3 km</text>

  <!-- Summary line -->
  <rect x="30" y="416" width="740" height="32" rx="6" fill="#1e2a1e"/>
  <text x="42" y="437" fill="#c8e6c8" font-size="12">Found <tspan font-weight="700">14 power plants</tspan> within 10 km. Types: 6 Hydropower, 5 Photovoltaic, 2 Biomass, 1 Wind.</text>

  <!-- Footer -->
  <rect x="0" y="462" width="800" height="58" rx="0" fill="#131425"/>
  <rect x="0" y="508" width="800" height="12" rx="0" ry="0" fill="#131425"/>
  <rect x="0" y="508" width="800" height="12" rx="12" fill="#131425"/>
  <text x="400" y="485" fill="#555775" font-size="11" text-anchor="middle">swiss-energy-mcp  |  10 Tools  |  2 APIs  |  7 BFE Layers  |  No API Key</text>
  <text x="400" y="505" fill="#444560" font-size="10" text-anchor="middle">Data: Swiss Federal Office of Energy (SFOE/BFE) via GeoAdmin REST API + opendata.swiss</text>
</svg>
